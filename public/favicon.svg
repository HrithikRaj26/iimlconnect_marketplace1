<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" /> <!-- Blue 600 -->
      <stop offset="50%" stop-color="#4f46e5" /> <!-- Indigo 600 -->
      <stop offset="100%" stop-color="#7c3aed" /> <!-- Violet 600 -->
    </linearGradient>
    <!-- Accent Gradient for Nodes -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" /> <!-- Sky 400 -->
      <stop offset="100%" stop-color="#818cf8" /> <!-- Indigo 400 -->
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Icon Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Inner Connection Paths (Network Nodes) -->
  <g stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-dasharray="12 12" fill="none">
    <path d="M120 180 C 200 120, 312 120, 392 180" />
    <path d="M120 332 C 200 392, 312 392, 392 332" />
    <path d="M120 180 L 392 332" />
  </g>

  <!-- The Interconnected "C" and "L" Logo Symbol -->
  <g filter="url(#glow)">
    <!-- Base Ribbon (C Shape) -->
    <path d="M370 160 
             C 320 110, 192 110, 142 160 
             C 92 210, 92 302, 142 352 
             C 192 402, 320 402, 370 352" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="52" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Connecting "L" Arm / Node bridge -->
    <path d="M230 256 L 370 256" 
          fill="none" 
          stroke="url(#accent-grad)" 
          stroke-width="44" 
          stroke-linecap="round" />
  </g>

  <!-- Glowing Connection Nodes (Sparkles/Dots) -->
  <!-- Top Node -->
  <circle cx="370" cy="160" r="28" fill="#ffffff" filter="url(#glow)" />
  <circle cx="370" cy="160" r="14" fill="#38bdf8" />

  <!-- Bottom Node -->
  <circle cx="370" cy="352" r="28" fill="#ffffff" filter="url(#glow)" />
  <circle cx="370" cy="352" r="14" fill="#818cf8" />

  <!-- Center Connection Node -->
  <circle cx="370" cy="256" r="32" fill="#ffffff" filter="url(#glow)" />
  <circle cx="370" cy="256" r="18" fill="url(#accent-grad)" />

</svg>
